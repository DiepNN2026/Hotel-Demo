<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang Quản Trị Khách Sạn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark px-4">
        <a class="navbar-brand fw-bold" href="index.html">⬅ Về Trang Chủ</a>
        <span class="text-white">Khu Vực Quản Trị Khách Sạn</span>
    </nav>

    <div class="container my-4">
        <ul class="nav nav-tabs mb-4" role="tablist">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#rooms-tab">Quản Lý Phòng</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#report-tab">Báo Cáo Doanh Thu</button></li>
        </ul>

        <div class="tab-content">
            <!-- Quản lý phòng -->
            <div class="tab-pane fade show active" id="rooms-tab">
                <div class="row">
                    <div class="col-md-5 card p-4">
                        <h4 class="mb-3">Thêm / Sửa Phòng</h4>
                        <input type="hidden" id="r-id">
                        <div class="mb-3"><label>Tên phòng:</label><input type="text" id="r-name" class="form-control" placeholder="Ví dụ: Phòng 101"></div>
                        <div class="mb-3"><label>Giá theo đêm (VNĐ):</label><input type="number" id="r-price" class="form-control"></div>
                        <button class="btn btn-success" onclick="saveRoom()">Lưu Phòng</button>
                    </div>
                    <div class="col-md-7">
                        <table class="table table-bordered bg-white">
                            <thead><tr><th>Tên Phòng</th><th>Giá/Đêm</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
                            <tbody id="admin-room-table"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Báo cáo -->
            <div class="tab-pane fade" id="report-tab">
                <div class="card p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="mb-0">Báo Cáo Doanh Thu & Lợi Nhuận</h4>
                        <a href="/api/reports/export-excel" class="btn btn-success fw-bold">📥 Xuất Excel (Đa Sheet & Đóng Khung)</a>
                    </div>
                    <div class="row text-center g-3">
                        <div class="col-md-4"><div class="p-3 bg-light border rounded"><h6 class="text-muted">Tổng Doanh Thu</h6><h4 class="text-primary fw-bold" id="rep-revenue">0đ</h4></div></div>
                        <div class="col-md-4"><div class="p-3 bg-light border rounded"><h6 class="text-muted">Tổng Chi Phí</h6><h4 class="text-warning fw-bold" id="rep-expense">0đ</h4></div></div>
                        <div class="col-md-4"><div class="p-3 bg-light border rounded"><h6 class="text-muted">LỢI NHUẬN THUẦN</h6><h4 class="text-success fw-bold" id="rep-net">0đ</h4></div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function loadAll() {
            const rRes = await fetch('/api/rooms');
            const rooms = await rRes.json();
            document.getElementById('admin-room-table').innerHTML = rooms.map(r => `
                <tr>
                    <td><b>${r.room_name}</b></td>
                    <td>${r.price_per_night.toLocaleString()}đ</td>
                    <td><span class="badge ${r.status === 'Trống' ? 'bg-success' : 'bg-danger'}">${r.status}</span></td>
                    <td><button class="btn btn-sm btn-danger" onclick="deleteRoom(${r.id})">Xóa</button></td>
                </tr>
            `).join('');

            const repRes = await fetch('/api/reports/revenue');
            const rep = await repRes.json();
            document.getElementById('rep-revenue').innerText = Number(rep.totalRevenue).toLocaleString() + 'đ';
            document.getElementById('rep-expense').innerText = Number(rep.totalExpense).toLocaleString() + 'đ';
            document.getElementById('rep-net').innerText = Number(rep.netProfit).toLocaleString() + 'đ';
        }

        async function saveRoom() {
            await fetch('/api/rooms/save', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id: document.getElementById('r-id').value, room_name: document.getElementById('r-name').value, price_per_night: document.getElementById('r-price').value })
            });
            alert('Lưu phòng thành công!'); loadAll();
        }

        async function deleteRoom(id) {
            if(confirm('Xóa phòng này?')) { await fetch(`/api/rooms/${id}`, { method: 'DELETE' }); loadAll(); }
        }

        loadAll();
    </script>
</body>
</html>
